plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.80'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
neoForge {
   version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument ''
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},simulated"
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }


    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url = "https://jm.gserv.me/repository/maven-public/" }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate

    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }

    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }

    maven {
        name = "Illusivec4"
        url = "https://maven.theillusivec4.top/"
    } // Curios

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        url "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }

    maven {
        name = "Valkyrien Skies"
        url = "https://maven.valkyrienskies.org"
    }
    flatDir {
        dirs 'lib'
    }

}

dependencies {
    def includeOptionalCbcCompatRuntime = !project.hasProperty("skipOptionalCbcCompatRuntime")

    compileOnly files ("lib/createenergycannons-forge-0.2.jar")
    compileOnly("org.joml:joml-primitives:1.10.0")
    compileOnly("maven.modrinth:kotlin-for-forge:${forge_kotlin_version}")
    compileOnly("org.valkyrienskies.core:api:${vs_core_version}") { transitive = false }
    compileOnly("org.valkyrienskies.core:impl:${vs_core_version}"){ transitive = false }
    compileOnly("org.valkyrienskies.core:util:${vs_core_version}"){ transitive = false }
    compileOnly("org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}") {transitive = false}
    compileOnly("curse.maven:create-clockwork-807792:7418660")
	    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
	    localRuntime("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
	    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cc_tweaked_version}")
	    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cc_tweaked_version}")
	    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_tweaked_version}")
	    localRuntime("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_tweaked_version}")
	    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    localRuntime("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    localRuntime("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    localRuntime("com.tterrag.registrate:Registrate:${registrate_version}")
    //Sable
    compileOnly("foundry.veil:veil-neoforge-${project.minecraft_version}:${project.veil_version}") {
        exclude group: "maven.modrinth"
    }
    localRuntime("foundry.veil:veil-neoforge-${project.minecraft_version}:${project.veil_version}")
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: "foundry.veil"
    }
    localRuntime("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")

//    // CBC
//    implementation("maven.modrinth:create-big-cannons:${cbc_version}") {
//        transitive = false
//    }
    implementation("maven.modrinth:rpl:${rpl_version}") {
        transitive = false
    }
    compileOnly files("lib/createenergycannons-0.2+mc1.20.1.jar")
    compileOnly files("lib/createbigcannons-${cbc_version}+mc.${minecraft_version}.jar")
    compileOnly files("lib/cbcmodernwarfare-${cbc_mw_version}+mc.${minecraft_version}-neoforge.jar")
    compileOnly files("lib/cbc_at_Neoforge_${minecraft_version}_${cbc_at_version}.jar")
    compileOnly files("lib/CBC-Military-Supplement-1.21.1-2.1.0.jar")
    localRuntime files("lib/createbigcannons-${cbc_version}+mc.${minecraft_version}.jar")
    if (includeOptionalCbcCompatRuntime) {
        localRuntime files("lib/cbcmodernwarfare-${cbc_mw_version}+mc.${minecraft_version}-neoforge.jar")
        localRuntime files("lib/cbc_at_Neoforge_${minecraft_version}_${cbc_at_version}.jar")
        localRuntime files("lib/CBC-Military-Supplement-1.21.1-2.1.0.jar")
    }

    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"


    //Simulated
    compileOnly("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_version}")
    localRuntime("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_version}")

    //offroad
    compileOnly("dev.ryanhcode.offroad:offroad-neoforge-${minecraft_version}:${offroad_version}")
    localRuntime("dev.ryanhcode.offroad:offroad-neoforge-${minecraft_version}:${offroad_version}")

    //Aeronautics
    compileOnly("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${aeronautics_version}")
    localRuntime("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${aeronautics_version}")
    implementation "curse.maven:vanishmod-423535:7668159"
    jarJar(api("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"))
}


tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('targetingSolverSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs deterministic targeting solver regression checks.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.happysg.radar.targeting.TargetingSolverSelfTest'
}

tasks.register('kineticControllerSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs deterministic Swivel controller angle and calibration checks.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.happysg.radar.block.controller.kinetic.KineticControllerSelfTest'
}

tasks.register('tPitchPlacementSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs deterministic T-Pitch placement and model-orientation checks.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.happysg.radar.block.controller.tpitch.TPitchPlacementSelfTest'
}

tasks.register('weaponNetworkRelocationSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs deterministic weapon network relocation checks.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.happysg.radar.block.behavior.networks.WeaponNetworkRelocationSelfTest'
}

tasks.register('optionalCbcIsolationCheck') {
    group = 'verification'
    description = 'Checks CBC:MS, CBC:AT, and CBC:MW class-loading isolation without those mods present.'
    dependsOn tasks.named('classes')

    doLast {
        if (!project.hasProperty('skipOptionalCbcCompatRuntime')) {
            throw new GradleException(
                    'Run optionalCbcIsolationCheck with -PskipOptionalCbcCompatRuntime')
        }

        def forbiddenJarTokens = [
                'cbcmodernwarfare',
                'cbc_at_',
                'cbc-military-supplement'
        ]
        def leakedJars = sourceSets.main.runtimeClasspath.files.findAll { file ->
            def name = file.name.toLowerCase(Locale.ROOT)
            forbiddenJarTokens.any { name.contains(it) }
        }
        if (!leakedJars.isEmpty()) {
            throw new GradleException(
                    "Optional CBC jars leaked onto the isolation classpath: ${leakedJars}")
        }

        def forbiddenClassPrefixes = [
                'riftyboi/cbcmodernwarfare/',
                'com/cainiao1053/cbcmoreshells/',
                'com/dsvv/cbcat/'
        ]
        def allowedBridgePrefixes = [
                'com/happysg/radar/compat/cbcmw/CBCMW',
                'com/happysg/radar/compat/cbcmoreshells/CBCMSCannonCompat',
                'com/happysg/radar/compat/cbc_at/CBCATCannonCompat',
                'com/happysg/radar/compat/cbc/CBCATCompat',
                'com/happysg/radar/mixin/CBCAT'
        ]
        def boundaryViolations = []
        def unsafePseudoMixins = []
        sourceSets.main.output.classesDirs.files.each { classesDir ->
            if (!classesDir.exists()) {
                return
            }
            classesDir.eachFileRecurse { classFile ->
                if (!classFile.name.endsWith('.class')) {
                    return
                }
                def relativePath = classesDir.toPath().relativize(classFile.toPath())
                        .toString().replace(File.separatorChar, '/' as char)
                def classBytes = new String(
                        classFile.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                if (relativePath.startsWith('com/happysg/radar/mixin/CBCAT')) {
                    if (!classBytes.contains('org/spongepowered/asm/mixin/Pseudo')) {
                        unsafePseudoMixins.add(relativePath)
                    }
                    return
                }
                if (allowedBridgePrefixes.any { relativePath.startsWith(it) }) {
                    return
                }
                if (forbiddenClassPrefixes.any { classBytes.contains(it) }) {
                    boundaryViolations.add(relativePath)
                }
            }
        }
        if (!boundaryViolations.isEmpty()) {
            throw new GradleException(
                    "Unguarded optional CBC class references found in: ${boundaryViolations}")
        }
        if (!unsafePseudoMixins.isEmpty()) {
            throw new GradleException(
                    "Optional CBC:AT mixins missing @Pseudo: ${unsafePseudoMixins}")
        }

        def urls = sourceSets.main.runtimeClasspath.files.collect {
            it.toURI().toURL()
        } as URL[]
        def loader = new URLClassLoader(urls, ClassLoader.getPlatformClassLoader())
        try {
            [
                    'com.happysg.radar.compat.cbc.CannonMountContext',
                    'com.happysg.radar.compat.cbc.CannonUtil',
                    'com.happysg.radar.compat.cbc.CBCMuzzleUtil',
                    'com.happysg.radar.compat.cbc.CannonTargeting',
                    'com.happysg.radar.compat.cbc.VS2CannonTargeting',
                    'com.happysg.radar.block.behavior.networks.WeaponFiringControl',
                    'com.happysg.radar.block.controller.pitch.AutoPitchControllerBlockEntity',
                    'com.happysg.radar.block.controller.yaw.AutoYawControllerBlockEntity',
                    'com.happysg.radar.block.datalink.DataLinkBlockItem'
            ].each { className ->
                Class.forName(className, false, loader)
            }
        } finally {
            loader.close()
        }

        logger.lifecycle(
                'PASS optional CBC isolation: CBC:MS, CBC:AT, and CBC:MW are absent and core classes link safely')
    }
}

tasks.named('check') {
    dependsOn tasks.named('kineticControllerSelfTest')
    dependsOn tasks.named('tPitchPlacementSelfTest')
    dependsOn tasks.named('targetingSolverSelfTest')
    dependsOn tasks.named('weaponNetworkRelocationSelfTest')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
