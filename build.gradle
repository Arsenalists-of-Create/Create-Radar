plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
        id 'org.jetbrains.kotlin.jvm'
}

String buildNumber = System.getenv("GITHUB_RUN_NUMBER")
version = "${mod_version}${buildNumber != null ? ".${buildNumber}" : ""}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neo_version

    parchment {
        // No parchment for now, using official mappings
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    mavenLocal()

    maven { url = "https://maven.createmod.net" }           // Create, Ponder, Flywheel
    maven { url = "https://maven.tterrag.com" }             // Registrate
    maven { url = "https://maven.blamejared.com/" }         // JEI
    maven { url = "https://maven.architectury.dev/" }       // Architectury
    maven { url = "https://maven.saps.dev/minecraft" }      // FTB Mods (Saps)

    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup "curse.maven" }
    }
    maven { // RPL && CBC
        url = "https://maven.realrobotix.me/master/"
        content { includeGroup("com.rbasamoyai") }
    }
    maven {
        name = 'Kotlin for NeoForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup("thedarkcolour") }
    }
    maven {
        name = "Valkyrien Skies"
        url = "https://maven.valkyrienskies.org"
    }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://modmaven.dev/' }
    maven {
        url = "https://maven.squiddev.cc"
        content { includeGroup("cc.tweaked") }
    }

    flatDir {
        dirs 'lib'
    }
    maven { url = "https://maven.ryanhcode.dev/releases" }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    implementation("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    
    // Mixin Extras
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-neoforge:0.4.1")

    // CBC (Create Big Cannons) - using specific version IDs for NeoForge 1.21.1
    implementation("maven.modrinth:create-big-cannons:mFWvbnn8")
    implementation("maven.modrinth:rpl:hZ6B2Z0x")

    // JEI
    // compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    // runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // Kotlin for NeoForge
    // compileOnly("thedarkcolour:kotlinforforge-neoforge:${neo_kotlin_version}")

    // CC:Tweaked
    compileOnly("cc.tweaked:cc-tweaked-1.21.1-core-api:${cc_tweaked_version}")
    implementation("cc.tweaked:cc-tweaked-1.21.1-forge:${cc_tweaked_version}")

    // Valkyrien Skies (compileOnly - may not be available)
    compileOnly("org.joml:joml-primitives:1.10.0")
    compileOnly("org.valkyrienskies.core:api:${vs_core_version}") { transitive = false }
    compileOnly("org.valkyrienskies.core:impl:${vs_core_version}") { transitive = false }
    compileOnly("org.valkyrienskies.core:util:${vs_core_version}") { transitive = false }
    // compileOnly("org.valkyrienskies:valkyrienskies-121-neoforge:${vs2_version}") { transitive = false }

    // Create Aeronautics & Simulated physics engine
    implementation("dev.eriksonn.aeronautics:aeronautics-neoforge-1.21.1:1.1.0")
    implementation("dev.simulated_team.simulated:simulated-neoforge-1.21.1:1.1.0")

    // Other local jars
    implementation fileTree(dir: 'lib', include: ['*.jar', '*.jcl'])

    // Annotation processor for mixins
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    
    // Explicitly add missing architectury for 6.0.10
    implementation("dev.architectury:architectury-neoforge:13.0.8")
}

configurations.all {
    resolutionStrategy.force "dev.architectury:architectury-neoforge:13.0.8"
}



tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            create_version_range    : create_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'create_radar.mixins.json'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

kotlin {
    jvmToolchain(21)
}







