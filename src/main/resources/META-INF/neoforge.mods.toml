modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Arsenalists-of-Create/Create-Radar/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "create"
    type = "required"
    versionRange = "${create_version_range}"
    ordering = "BEFORE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "createbigcannons"
    type = "optional"
    versionRange = "[5.0.0,)"
    ordering = "BEFORE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "valkyrienskies"
    type = "optional"
    versionRange = "[2.0.0,)"
    ordering = "BEFORE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "shupapium"
    type = "optional"
    versionRange = "[1.0,2.0)"
    ordering = "BEFORE"
    side = "BOTH"

[[mixins]]
config="create_radar.mixins.json"
